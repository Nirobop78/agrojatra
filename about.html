<head>

    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://unpkg.com/lucide@latest">
    </script>
    <style>
        :root {
            --primary: linear-gradient(135deg, #57a6ff, #0f63ff);
            --p: rgb(0 130 255);
            --bg: #faf9f6;
            --c: #fff;
            --t: #1f2937;
            --b: #f7f7f7;
        }

        * {
            font-family: 'Google Sans', 'Noto Serif Bengali', sans-serif;
        }

        body {
            background: rgb(249 247 241);
            color: var(--t);
        }

        .card {
            background: var(--c);
            border-radius: 20px;
            border: 2px solid var(--b);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .03);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            border-radius: 12px;
            padding: 10px 20px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .input-field {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            background: #f9fafb;
            transition: 0.2s;
        }

        .input-field:focus {
            border-color: var(--p);
            outline: none;
        }

        .form-iframe {
            width: 100%;
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }

        .form-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
            background: #fff;
        }

        .form-iframe {
            width: 100%;
            min-height: 600px;
            border: none;
            display: block;
        }

        @media (max-width: 640px) {
            .form-iframe {
                min-height: 80vh;
            }
        }

        /* ---- হাইলাইট অ্যানিমেশন ---- */
        .highlight-name {
            display: inline;
            background-image: linear-gradient(to right, rgb(124 186 255), rgb(196 153 255));
            background-size: 0% 100%;
            background-repeat: no-repeat;
            background-position: 0 0;
            padding: 0 4px;
            border-radius: 0px;
            animation: highlightFill 1.2s ease forwards;
            color: inherit;
        }


        @keyframes highlightFill {
            0% {
                background-size: 0% 100%;
            }
            100% {
                background-size: 100% 100%;
            }
        }

        /* ব্লিঙ্কিং কার্সর */
        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: black;
            margin-left: 4px;
            vertical-align: text-bottom;
            animation: blink 0.9s infinite;
            border-radius: 1px;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 640px) {
            .typing-cursor {
                width: 2.5px;
            }
        }
    </style>
</head>
